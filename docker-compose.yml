services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: asteria
      POSTGRES_USER: asteria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asteria_dev}
    ports:
      - "5433:5432"
    volumes:
      - asteria_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asteria -d asteria"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  asteria_postgres:

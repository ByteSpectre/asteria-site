# Auto-deploy to VPS on push to main when GitHub Secrets are set.
# Without VPS_HOST / VPS_USER / VPS_SSH_KEY the job is skipped (Vercel-only is fine).
# Setup: deploy/vps/INSTRUCTION.md → «Автодеплой с GitHub»; overview: deploy/DEPLOY.md

name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ secrets.VPS_HOST != '' && secrets.VPS_USER != '' && secrets.VPS_SSH_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          PORT="${VPS_PORT:-22}"
          APP_DIR="/var/www/asteria"

          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${VPS_USER}@${VPS_HOST}" "APP_DIR=${APP_DIR} bash -s" <<'REMOTE'
          set -euo pipefail
          cd "${APP_DIR:?Set APP_DIR on the SSH step}"

          if [[ ! -f .env ]]; then
            echo "Missing ${APP_DIR}/.env on the server"
            exit 1
          fi

          git fetch origin main
          git reset --hard origin/main

          bash deploy/vps/deploy.sh
          REMOTE

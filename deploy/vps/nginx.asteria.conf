# Nginx для Астерии за ISPmanager / на голом VPS.
# Замените example.ru на ваш домен.
# Если сайт создан в ISPmanager, часто достаточно вставить proxy в конфиг сайта
# или указать обработчик Node.js (порт) — см. INSTRUCTION.md

upstream asteria_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.ru www.example.ru;

    client_max_body_size 6M;

    location / {
        proxy_pass http://asteria_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}

# После certbot появится блок listen 443 ssl — либо:
#   certbot --nginx -d example.ru -d www.example.ru

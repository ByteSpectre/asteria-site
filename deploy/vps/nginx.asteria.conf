# Nginx для Астерии на чистом Ubuntu VPS.
# Замените example.ru на ваш домен.
# sudo cp deploy/vps/nginx.asteria.conf /etc/nginx/sites-available/asteria

upstream asteria_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.ru www.example.ru;

    client_max_body_size 6M;

    location / {
        proxy_pass http://asteria_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}

# SSL добавит Certbot:
#   sudo certbot --nginx -d example.ru -d www.example.ru
